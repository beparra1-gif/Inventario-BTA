<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: en Android Chrome hace que el
         layout (y por lo tanto el 100dvh de .pantalla/.hoja) se achique
         cuando aparece el teclado, en vez de que el teclado tape contenido
         por encima sin que la página se entere. Los navegadores que no lo
         entienden lo ignoran sin problema. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#E20613" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MODULO CAPTURA DE INVENTARIO" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MODULO CAPTURA DE INVENTARIO</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
